# Single-project Sillage stack (ecom, ecom-db, valkey, lps-media, sillage-core, sillage-cron).
# Local edge gateway is optional: COMPOSE_PROFILES=local
#
# Fresh laptop / staging (minimal):
#   cp .env.example .env          # change-me passwords; domains can stay localhost
#   touch sillage-core/data/secrets.overlay.env
#   docker network create ecom_network
#   docker network create redis_network
#   docker compose --env-file .env up -d
#   # then open dashboard :4000 → Secrets → Settings URLs → Sync
#   # local browser on :80:
#   docker compose --env-file .env --profile local up -d
#
name: sillage

x-sillage-common: &sillage-common
  image: ${SILLAGE_CORE_IMAGE:-unseencurtain/sillage-core:latest}
  networks:
    - ecom_network
    - redis_network
  restart: unless-stopped
  depends_on:
    ecom-db:
      condition: service_healthy
    valkey:
      condition: service_started
  env_file:
    - .env
  environment:
    DB_HOST: ecom-db
    DB_PORT: "3306"
    REDIS_URL: redis://valkey:6379
    SILLAGE_PROFILE: retail
    SILLAGE_LOCK_PREFIX: sillage
    # Public shop URL (dashboard links); Settings → Shop URL can override at runtime.
    WP_BASE_URL: ${WP_BASE_URL:-http://127.0.0.1:104}
    # In-network WordPress for finalize / bridge REST (not the public hostname).
    WORDPRESS_INTERNAL_URL: ${WORDPRESS_INTERNAL_URL:-http://ecom}
    FIXTURES_DIR: /app/.feedscratch
    LPS_MEDIA_BASE_URL: ${LPS_MEDIA_BASE_URL:-http://127.0.0.1:105}
    IMAGE_HOST_BASE_URL: ${IMAGE_HOST_BASE_URL:-}
    PUBLIC_URL_BASE: ${PUBLIC_URL_BASE:-}
    # Dashboard Secrets UI writes here; applied on boot + each sync (hot-reload).
    SILLAGE_SECRETS_FILE: /app/data/secrets.overlay.env
    SITEMAP_DIR: /app/data/sitemaps
  volumes:
    - ${SILLAGE_LOGS_DIR:-./sillage-core/logs}:/app/logs
    - ${FEEDSCRATCH_DIR:-../.feedscratch}:/app/.feedscratch
    - ${IMAGE_OVERRIDES_FILE:-./sillage-core/data/image_overrides.json}:/app/data/image_overrides.json:ro
    # Must be a file (touch before first up). Writable so the Secrets API can persist keys.
    - ${SILLAGE_SECRETS_FILE:-./sillage-core/data/secrets.overlay.env}:/app/data/secrets.overlay.env
    # Host path Caddy serves as /wp-sitemap*.xml. Inside the container always /app/data/sitemaps.
    - ${SITEMAP_HOST_DIR:-./ecom_sites/data/sitemaps}:/app/data/sitemaps

# Wholesale shop — own WordPress, own MariaDB, own engine DBs, own containers.
# Valkey is the only shared process while both shops sit on this VPS (prefix wholesale: / db 1).
# When wholesale moves to another VPS it takes wholesale-db + its own Valkey.
# WPF is only the vendor SKU prefix (wholesale-perfumes), never a folder or container name.
x-wholesale-common: &wholesale-common
  image: ${SILLAGE_CORE_IMAGE:-unseencurtain/sillage-core:latest}
  profiles: ["wholesale"]
  networks:
    - ecom_network
    - redis_network
  restart: unless-stopped
  depends_on:
    wholesale-db:
      condition: service_healthy
    valkey:
      condition: service_started
  env_file:
    - .env
  environment:
    DB_HOST: wholesale-db
    DB_PORT: "3306"
    REDIS_URL: redis://valkey:6379
    SILLAGE_PROFILE: wholesale
    SILLAGE_LOCK_PREFIX: sillage-wholesale
    SILLAGE_DB: ${WHOLESALE_SILLAGE_DB:-sillage_wpf}
    WORDPRESS_DB: ${WHOLESALE_WORDPRESS_DB:-earth_wpf}
    WP_BASE_URL: ${WHOLESALE_WP_BASE_URL:-https://wholesale.mirainikki.xyz}
    WORDPRESS_INTERNAL_URL: ${WHOLESALE_WORDPRESS_INTERNAL_URL:-http://wholesale-ecom}
    SILLAGE_SHARED_SECRET: ${WHOLESALE_SILLAGE_SHARED_SECRET}
    FIXTURES_DIR: /app/.feedscratch
    LPS_MEDIA_BASE_URL: ${LPS_MEDIA_BASE_URL:-http://127.0.0.1:105}
    IMAGE_HOST_BASE_URL: ${IMAGE_HOST_BASE_URL:-}
    PUBLIC_URL_BASE: ${PUBLIC_URL_BASE:-}
    SILLAGE_SECRETS_FILE: /app/data/secrets.overlay.wholesale.env
    SITEMAP_DIR: /app/data/sitemaps-wholesale
  volumes:
    - ${WHOLESALE_LOGS_DIR:-./sillage-core/logs-wholesale}:/app/logs
    - ${FEEDSCRATCH_DIR:-../.feedscratch}:/app/.feedscratch
    - ${WHOLESALE_IMAGE_OVERRIDES_FILE:-./sillage-core/data/image_overrides.wholesale.json}:/app/data/image_overrides.json:ro
    - ${WHOLESALE_SILLAGE_SECRETS_FILE:-./sillage-core/data/secrets.overlay.wholesale.env}:/app/data/secrets.overlay.wholesale.env
    - ${WHOLESALE_SITEMAP_HOST_DIR:-./ecom_sites/data/sitemaps-wholesale}:/app/data/sitemaps-wholesale

services:
  ecom-db:
    container_name: ecom-db
    hostname: ecom-db
    image: ${MARIADB_IMAGE:-mariadb:latest}
    networks:
      - ecom_network
    restart: always
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_HOST_PORT:-3307}:3306"
    volumes:
      - ${DATA_DIR:-./ecom_sites/data}/wp-db:/var/lib/mysql
      - ${MARIADB_CNF:-./ecom_sites/config/mariadb.cnf}:/etc/mysql/conf.d/sillage.cnf:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PWD}
      MYSQL_DATABASE: ${MYSQL_DB:-earth}
      MYSQL_USER: ${MYSQL_USER:-lime}
      MYSQL_PASSWORD: ${MYSQL_PWD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  wholesale-db:
    profiles: ["wholesale"]
    container_name: wholesale-db
    hostname: wholesale-db
    image: ${MARIADB_IMAGE:-mariadb:latest}
    networks:
      - ecom_network
    restart: always
    ports:
      - "${WHOLESALE_DB_BIND:-127.0.0.1}:${WHOLESALE_DB_HOST_PORT:-3308}:3306"
    volumes:
      - ${DATA_DIR:-./ecom_sites/data}/wholesale-db:/var/lib/mysql
      - ${WHOLESALE_MARIADB_CNF:-./ecom_sites/config/mariadb.wholesale.cnf}:/etc/mysql/conf.d/sillage.cnf:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${WHOLESALE_MYSQL_ROOT_PWD:-${MYSQL_ROOT_PWD}}
      MYSQL_DATABASE: ${WHOLESALE_WORDPRESS_DB:-earth_wpf}
      MYSQL_USER: ${WHOLESALE_MYSQL_USER:-${MYSQL_USER:-lime}}
      MYSQL_PASSWORD: ${WHOLESALE_MYSQL_PWD:-${MYSQL_PWD}}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    container_name: valkey
    hostname: valkey
    image: ${VALKEY_IMAGE:-valkey/valkey:8-alpine}
    networks:
      - redis_network
    restart: unless-stopped
    command: valkey-server --save "" --appendonly no

  # Static product images. Host bind-mount (never a named volume).
  lps-media:
    container_name: lps-media
    hostname: lps-media
    image: ${LPS_MEDIA_IMAGE:-nginx:alpine}
    networks:
      - ecom_network
    restart: always
    ports:
      - "${MEDIA_BIND:-127.0.0.1}:${MEDIA_PORT:-105}:80"
    volumes:
      - ${DATA_DIR:-./ecom_sites/data}/media:/usr/share/nginx/html:ro
      - ${LPS_MEDIA_NGINX_CONF:-./ecom_sites/config/nginx-lps-media.conf}:/etc/nginx/conf.d/default.conf:ro

  ecom:
    container_name: ecom
    hostname: ecom
    image: ${WORDPRESS_IMAGE:-unseencurtain/sillage-wordpress:latest}
    networks:
      - ecom_network
      - redis_network
    restart: always
    ports:
      - "${ECOM_BIND:-127.0.0.1}:${ECOM_PORT:-104}:80"
    depends_on:
      ecom-db:
        condition: service_healthy
    volumes:
      - ${DATA_DIR:-./ecom_sites/data}/wp:/var/www/html
      - ${PHP_INI:-./ecom_sites/config/php.ini}:/usr/local/etc/php/conf.d/conf.ini:ro
      - ${APACHE_HIDE_CONF:-./ecom_sites/config/apache-hide-version.conf}:/etc/apache2/conf-enabled/z-hide-version.conf:ro
    environment:
      WORDPRESS_DB_HOST: ecom-db
      WORDPRESS_DB_USER: ${MYSQL_USER:-lime}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PWD}
      WORDPRESS_DB_NAME: ${MYSQL_DB:-earth}

  # API + dashboard. Separate from cron so a full sync cannot stall webhooks.
  sillage-core:
    <<: *sillage-common
    container_name: sillage-core
    hostname: sillage-core
    command: ["bun", "run", "src/server/index.ts"]
    ports:
      - "${SILLAGE_BIND:-127.0.0.1}:${SILLAGE_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  sillage-cron:
    <<: *sillage-common
    container_name: sillage-cron
    hostname: sillage-cron
    command: ["/usr/local/bin/supercronic", "-passthrough-logs", "/app/crontab"]

  # ── Wholesale shop (compose profile `wholesale`) ──────────────────────────
  # Own WordPress + own MariaDB. Valkey shared on this VPS only. Enable: COMPOSE_PROFILES=wholesale
  wholesale-ecom:
    profiles: ["wholesale"]
    container_name: wholesale-ecom
    hostname: wholesale-ecom
    image: ${WORDPRESS_IMAGE:-unseencurtain/sillage-wordpress:latest}
    networks:
      - ecom_network
      - redis_network
    restart: always
    ports:
      - "${WHOLESALE_ECOM_BIND:-127.0.0.1}:${WHOLESALE_ECOM_PORT:-106}:80"
    depends_on:
      wholesale-db:
        condition: service_healthy
    volumes:
      - ${DATA_DIR:-./ecom_sites/data}/wp-wholesale:/var/www/html
      - ${PHP_INI:-./ecom_sites/config/php.ini}:/usr/local/etc/php/conf.d/conf.ini:ro
      - ${APACHE_HIDE_CONF:-./ecom_sites/config/apache-hide-version.conf}:/etc/apache2/conf-enabled/z-hide-version.conf:ro
    environment:
      WORDPRESS_DB_HOST: wholesale-db
      WORDPRESS_DB_USER: ${WHOLESALE_MYSQL_USER:-${MYSQL_USER:-lime}}
      WORDPRESS_DB_PASSWORD: ${WHOLESALE_MYSQL_PWD:-${MYSQL_PWD}}
      WORDPRESS_DB_NAME: ${WHOLESALE_WORDPRESS_DB:-earth_wpf}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'valkey');
        define('WP_REDIS_PORT', 6379);
        define('WP_REDIS_PREFIX', 'wholesale:');
        define('WP_REDIS_DATABASE', 1);
        define('WP_CACHE_KEY_SALT', 'wholesale:');
        define('SILLAGE_SHARED_SECRET', '${WHOLESALE_SILLAGE_SHARED_SECRET}');
        define('SILLAGE_CORE_URL', 'http://wholesale-core:4000');
        define('SILLAGE_DASHBOARD_URL', 'https://${WHOLESALE_DASH_DOMAIN:-sillage-wholesale.mirainikki.xyz}');
        define('SILLAGE_DB', '${WHOLESALE_SILLAGE_DB:-sillage_wpf}');
        define('SILLAGE_STOREFRONT_PROFILE', 'wholesale');
        define('DISABLE_WP_CRON', true);

  wholesale-core:
    <<: *wholesale-common
    container_name: wholesale-core
    hostname: wholesale-core
    command: ["bun", "run", "src/server/index.ts"]
    ports:
      - "${WHOLESALE_SILLAGE_BIND:-127.0.0.1}:${WHOLESALE_SILLAGE_PORT:-4001}:4000"
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  wholesale-cron:
    <<: *wholesale-common
    container_name: wholesale-cron
    hostname: wholesale-cron
    command: ["/usr/local/bin/supercronic", "-passthrough-logs", "/app/crontab"]

  # Local-only edge (VPS uses host Caddy). Enable with --profile local.
  shop-gateway:
    profiles: ["local"]
    container_name: shop-gateway
    hostname: shop-gateway
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    networks:
      - ecom_network
    ports:
      - "${GATEWAY_PORT:-80}:80"
    restart: always
    depends_on:
      - ecom
      - lps-media
    volumes:
      - ${GATEWAY_CADDYFILE:-./ecom_sites/config/Caddyfile.compose}:/etc/caddy/Caddyfile:ro
      - ${SITEMAP_HOST_DIR:-./ecom_sites/data/sitemaps}:/srv/sitemaps:ro

networks:
  ecom_network:
    name: ecom_network
    external: true
  redis_network:
    name: redis_network
    external: true
