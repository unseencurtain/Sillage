# Serve Brasty/LPS product images outside the WordPress tree.
# Host path: ecom_sites/data/media → container /var/www/lps-media (read-only).
# Public URL: /lps-media/<EAN>.jpg
Alias /lps-media /var/www/lps-media

<Directory /var/www/lps-media>
	Options -Indexes +FollowSymLinks
	AllowOverride None
	Require all granted
</Directory>
