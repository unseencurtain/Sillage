# Static product images only — no PHP, no WordPress.
# Host bind-mount: ecom_sites/data/media → /usr/share/nginx/html
# Preferred public URLs: https://images.<domain>/<file> (Caddy site → this root).
# Fallback: shop /lps-media/* is stripped by the edge proxy (compose gateway or VPS Caddy).
server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	autoindex off;

	# Deny hidden files and path traversal noise.
	location ~ /\. {
		deny all;
		access_log off;
		log_not_found off;
	}

	location / {
		try_files $uri =404;
	}

	location ~* \.(jpg|jpeg|png|webp|gif)$ {
		expires 30d;
		add_header Cache-Control "public, max-age=2592000, immutable";
		try_files $uri =404;
	}
}
